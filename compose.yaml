services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jewelry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jewelry"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - jewelry-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Supabase: Host=postgres;Port=5432;Database=jewelry;Username=postgres;Password=postgres;SSL Mode=Disable
      Database__ApplyMigrations: "true"
      Database__SeedDemoData: "true"
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5080
        VITE_WHATSAPP_NUMBER: "593996359219"
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  jewelry-postgres:
